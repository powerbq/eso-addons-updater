[package]
name = "eso-addons-updater"
version = "0.2.0"
edition = "2021"
authors = ["powerbq"]
license = "MIT"
description = "Updater and launcher for ESO Addons Manager"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
fltk = "1.4"
ureq = "2.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
